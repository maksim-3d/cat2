<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Статистика котов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 100%; }
        .header { text-align: center; margin-bottom: 30px; color: white; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: rgba(255, 255, 255, 0.95); border-radius: 15px; padding: 20px; text-align: center; }
        .stat-value { font-size: 36px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .stat-label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .loading { text-align: center; padding: 40px; color: white; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .refresh-btn { width: 100%; padding: 18px; background: #0088cc; color: white; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .error { background: rgba(255, 50, 50, 0.2); border-radius: 10px; padding: 15px; color: white; text-align: center; margin-bottom: 15px; }
        .success { background: rgba(50, 255, 50, 0.2); border-radius: 10px; padding: 15px; color: white; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐱 Статистика котов</h1>
            <p id="status">Инициализация...</p>
        </div>
        
        <div id="stats">
            <div class="loading">
                <div class="spinner"></div>
                <div>Подключение к серверу...</div>
            </div>
        </div>
        
        <button onclick="loadData()" class="refresh-btn">🔄 Обновить</button>
        
        <div id="message" style="display: none;"></div>
        
        <div style="margin-top: 20px; text-align: center; color: rgba(255,255,255,0.7); font-size: 12px;">
            IP сервера: 78.40.188.120:3000
        </div>
    </div>

    <script>
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Рабочие CORS прокси (проверены)
        const WORKING_PROXIES = [
            {
                name: 'AllOrigins',
                getUrl: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                parseResponse: async (response) => {
                    const data = await response.json();
                    return JSON.parse(data.contents);
                }
            },
            {
                name: 'CorsProxy',
                getUrl: (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                parseResponse: async (response) => await response.json()
            },
            {
                name: 'GitHubProxy',
                getUrl: (url) => `https://api.codetabs.com/v1/proxy?quest=${url}`,
                parseResponse: async (response) => await response.json()
            }
        ];
        
        let currentProxy = 0;
        const SERVER_URL = 'http://78.40.188.120:3000/stats';
        
        // Функция загрузки через прокси
        async function loadData() {
            const proxy = WORKING_PROXIES[currentProxy];
            console.log(`Пробую прокси: ${proxy.name}`);
            
            showMessage(`Использую ${proxy.name}...`, 'success');
            document.getElementById('status').textContent = `Подключение через ${proxy.name}...`;
            
            try {
                const proxyUrl = proxy.getUrl(SERVER_URL);
                console.log('Запрос к:', proxyUrl);
                
                const response = await fetch(proxyUrl, {
                    headers: {
                        'Accept': 'application/json',
                        'User-Agent': 'Telegram-Mini-App'
                    },
                    timeout: 10000
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await proxy.parseResponse(response);
                console.log('Данные получены:', data);
                
                displayData(data);
                showMessage(`✓ Успешно через ${proxy.name}`, 'success');
                document.getElementById('status').textContent = `Обновлено: ${new Date().toLocaleTimeString()}`;
                
            } catch (error) {
                console.error(`Прокси ${proxy.name} не сработал:`, error);
                
                // Пробуем следующий прокси
                currentProxy = (currentProxy + 1) % WORKING_PROXIES.length;
                
                if (currentProxy === 0) {
                    // Все прокси не работают, показываем демо данные
                    showMessage('Все прокси не работают. Показываю демо данные.', 'error');
                    showDemoData();
                    document.getElementById('status').textContent = 'Демо режим';
                } else {
                    // Пробуем следующий прокси через 2 секунды
                    setTimeout(loadData, 2000);
                }
            }
        }
        
        // Демо данные
        function showDemoData() {
            const demoData = {
                totalCats: 1854,
                totalAttacks: 3247,
                avgSuccess: 72,
                totalMatroskin: 56,
                count: 22,
                timestamp: new Date().toISOString(),
                note: 'Демо данные (сервер недоступен)'
            };
            displayData(demoData);
        }
        
        // Отображение данных
        function displayData(data) {
            document.getElementById('stats').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${formatNumber(data.totalCats || 0)}</div>
                        <div class="stat-label">Всего котов</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${formatNumber(data.totalAttacks || 0)}</div>
                        <div class="stat-label">Всего атак</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.avgSuccess || 0}%</div>
                        <div class="stat-label">Успешность</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${formatNumber(data.totalMatroskin || 0)}</div>
                        <div class="stat-label">Матросскины</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.count || 0}</div>
                        <div class="stat-label">Игроков онлайн</div>
                    </div>
                </div>
                <div style="text-align:center; color:white; margin-top:10px; font-size:12px;">
                    ${data.timestamp ? 'Обновлено: ' + new Date(data.timestamp).toLocaleTimeString() : ''}
                    ${data.note ? '<br>' + data.note : ''}
                </div>
            `;
        }
        
        // Вспомогательные функции
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.innerHTML = text;
            msg.className = type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }
        
        // Автостарт
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadData, 1000); // Ждем инициализацию Telegram
            setInterval(loadData, 1000); // Автообновление
        });
    </script>
</body>
</html>
