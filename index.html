<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cats Stats</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stat-card { background: #f8f9fa; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid transparent; transition: all 0.3s; }
        .stat-card:hover { border-color: #667eea; transform: translateY(-2px); }
        .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #333; }
        .loading { text-align: center; padding: 50px; color: #666; }
        .error { text-align: center; padding: 20px; color: #e74c3c; background: #ffe6e6; border-radius: 10px; margin-top: 20px; }
        .refresh-btn { display: block; width: 100%; padding: 15px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: all 0.3s; }
        .refresh-btn:hover { background: #5a67d8; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐱 Статистика Котов</h1>
            <p id="timestamp">Загрузка...</p>
        </div>
        
        <div id="stats-container" class="loading">
            <div style="text-align: center;">
                <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;"></div>
                Загрузка данных...
            </div>
        </div>
        
        <button id="refreshBtn" class="refresh-btn">🔄 Обновить</button>
        
        <div id="errorContainer" class="error" style="display: none;"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Стили для Telegram
        tg.setHeaderColor('#667eea');
        tg.setBackgroundColor('#f0f0f0');
        
        // Анимация загрузки
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
        
        // Конфигурация сервера
        const SERVER_URL = 'http://78.40.188.120:3000'; // Используем HTTP для простоты
        
        // Кэш для данных
        let cachedData = null;
        let lastUpdate = null;
        
        // Основная функция загрузки данных
        async function loadStats() {
            console.log('Loading stats from:', SERVER_URL);
            
            const statsContainer = document.getElementById('stats-container');
            const errorContainer = document.getElementById('errorContainer');
            const timestampElement = document.getElementById('timestamp');
            
            // Показываем загрузку
            errorContainer.style.display = 'none';
            statsContainer.innerHTML = `
                <div style="text-align: center;">
                    <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;"></div>
                    Загрузка данных...
                </div>
            `;
            
            try {
                // Telegram Mini Apps могут блокировать прямые запросы, используем прокси
                const response = await fetchWithFallback(`${SERVER_URL}/stats`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                cachedData = data;
                lastUpdate = new Date();
                
                // Отображаем данные
                displayStats(data);
                
                // Обновляем время
                timestampElement.textContent = `Обновлено: ${new Date().toLocaleTimeString()}`;
                
            } catch (error) {
                console.error('Error loading stats:', error);
                
                // Показываем кэшированные данные если есть
                if (cachedData) {
                    displayStats(cachedData);
                    errorContainer.innerHTML = `<strong>Внимание:</strong> Не удалось обновить данные. Показаны данные от ${lastUpdate.toLocaleTimeString()}`;
                    errorContainer.style.display = 'block';
                } else {
                    statsContainer.innerHTML = '<div class="error">Не удалось загрузить данные</div>';
                }
            }
        }
        
        // Функция с fallback методами
        async function fetchWithFallback(url) {
            try {
                // Метод 1: Прямой запрос
                return await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                });
            } catch (error) {
                console.log('Direct fetch failed, trying JSONP...');
                
                // Метод 2: JSONP через прокси
                return new Promise((resolve, reject) => {
                    window.jsonpCallback = function(data) {
                        resolve({
                            ok: true,
                            json: () => Promise.resolve(data)
                        });
                    };
                    
                    const script = document.createElement('script');
                    script.src = `${url}?callback=jsonpCallback&_=${Date.now()}`;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
        }
        
        // Отображение статистики
        function displayStats(data) {
            const statsContainer = document.getElementById('stats-container');
            
            const html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Всего котов</h3>
                        <div class="value">${formatNumber(data.totalCats || 0)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Всего атак</h3>
                        <div class="value">${formatNumber(data.totalAttacks || 0)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Успешность</h3>
                        <div class="value">${data.avgSuccess || 0}%</div>
                    </div>
                    <div class="stat-card">
                        <h3>Матросскины</h3>
                        <div class="value">${formatNumber(data.totalMatroskin || 0)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Игроков</h3>
                        <div class="value">${data.count || 0}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Время</h3>
                        <div class="value">${new Date(data.timestamp).toLocaleTimeString()}</div>
                    </div>
                </div>
            `;
            
            statsContainer.innerHTML = html;
        }
        
        // Форматирование чисел
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            // Кнопка обновления
            document.getElementById('refreshBtn').addEventListener('click', loadStats);
            
            // Загружаем данные сразу
            loadStats();
            
            // Автообновление каждые 30 секунд
            setInterval(loadStats, 30000);
            
            // Сообщаем Telegram что приложение загружено
            tg.ready();
        });
    </script>
</body>
</html>
