<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика котов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        /* Стили остаются прежними */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { max-width: 1200px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; color: white; }
        .header h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1.2rem; opacity: 0.9; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-bottom: 30px; }
        .stat-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); transition: transform 0.3s ease, box-shadow 0.3s ease; text-align: center; }
        .stat-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); }
        .stat-icon { font-size: 3rem; color: #667eea; margin-bottom: 20px; }
        .stat-value { font-size: 2.5rem; font-weight: 800; color: #333; margin-bottom: 10px; }
        .stat-label { font-size: 1.2rem; color: #666; font-weight: 600; }
        .stat-details { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); margin-bottom: 30px; }
        .details-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0; }
        .details-header h2 { color: #333; font-size: 1.8rem; }
        .timestamp { color: #666; font-size: 0.9rem; }
        .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .detail-item { padding: 15px; background: #f8f9ff; border-radius: 10px; }
        .detail-label { font-weight: 600; color: #555; margin-bottom: 5px; }
        .detail-value { font-size: 1.3rem; font-weight: 700; color: #333; }
        .controls { text-align: center; margin-top: 30px; }
        .btn { background: white; color: #667eea; border: none; padding: 15px 40px; font-size: 1.1rem; font-weight: 600; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); display: inline-flex; align-items: center; gap: 10px; }
        .btn:hover { background: #667eea; color: white; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }
        .status-bar { background: rgba(255, 255, 255, 0.9); border-radius: 50px; padding: 15px 30px; margin-top: 20px; display: inline-block; font-weight: 600; }
        .status-online { color: #10b981; }
        .status-offline { color: #ef4444; }
        .note { background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; border-radius: 8px; margin-top: 20px; font-size: 0.95rem; }
        .loading { text-align: center; padding: 50px; color: white; font-size: 1.5rem; }
        .loading i { font-size: 2rem; margin-bottom: 15px; display: block; }
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .stat-card { padding: 20px; }
            .stat-value { font-size: 2rem; }
            .details-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cat"></i> Статистика котов</h1>
            <p id="pageInfo">Загрузка данных...</p>
        </div>
        
        <div id="loading" class="loading">
            <i class="fas fa-paw fa-spin"></i>
            <div id="loadingText">Загружаем данные...</div>
        </div>
        
        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-cat"></i></div>
                    <div class="stat-value" id="totalCats">0</div>
                    <div class="stat-label">Всего котов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-crosshairs"></i></div>
                    <div class="stat-value" id="totalAttacks">0</div>
                    <div class="stat-label">Всего атак</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
                    <div class="stat-value" id="avgSuccess">0%</div>
                    <div class="stat-label">Успешных атак</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-crown"></i></div>
                    <div class="stat-value" id="totalMatroskin">0</div>
                    <div class="stat-label">Котов Матроскиных</div>
                </div>
            </div>
            
            <div class="stat-details">
                <div class="details-header">
                    <h2><i class="fas fa-info-circle"></i> Детальная информация</h2>
                    <div class="timestamp" id="timestamp">Загрузка...</div>
                </div>
                <div class="details-grid">
                    <div class="detail-item">
                        <div class="detail-label">Количество в базе</div>
                        <div class="detail-value" id="count">0</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Статус данных</div>
                        <div class="detail-value" id="dataStatus">Проверка...</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Версия данных</div>
                        <div class="detail-value" id="dataVersion">—</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Последнее обновление</div>
                        <div class="detail-value" id="lastUpdate">—</div>
                    </div>
                </div>
                <div id="noteContainer"></div>
            </div>
            
            <div class="controls">
                <button class="btn" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Обновить данные
                </button>
                <button class="btn" id="forceRefreshBtn" style="background: #f0b90b; color: #000;">
                    <i class="fas fa-bolt"></i> Принудительное обновление
                </button>
                <div class="status-bar" id="statusBar">
                    Статус: <span id="statusText">Загрузка...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const CONFIG = {
            DATA_URL: 'data.json',
            UPDATE_INTERVAL: 10000, // 10 секунд для тестирования
            VERSION: '1.0'
        };
        
        // Глобальные переменные
        let currentDataHash = '';
        let lastUpdateTime = 0;
        
        // DOM элементы
        const elements = {
            loading: document.getElementById('loading'),
            loadingText: document.getElementById('loadingText'),
            content: document.getElementById('content'),
            refreshBtn: document.getElementById('refreshBtn'),
            forceRefreshBtn: document.getElementById('forceRefreshBtn'),
            statusText: document.getElementById('statusText'),
            statusBar: document.getElementById('statusBar'),
            pageInfo: document.getElementById('pageInfo')
        };
        
        // Функция для создания хеша данных (для проверки изменений)
        function createDataHash(data) {
            const str = JSON.stringify(data);
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString(36);
        }
        
        // Функция для получения данных с принудительным обновлением кеша
        async function fetchData(forceRefresh = false) {
            let url = CONFIG.DATA_URL;
            
            if (forceRefresh) {
                // Добавляем параметр для обхода кеша
                url += '?nocache=' + Date.now() + '&v=' + Math.random();
            } else {
                // Обычный запрос с версией
                url += '?v=' + CONFIG.VERSION;
            }
            
            const response = await fetch(url, {
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            return await response.json();
        }
        
        // Основная функция загрузки данных
        async function loadData(forceRefresh = false) {
            try {
                elements.statusText.textContent = forceRefresh ? 'Принудительная загрузка...' : 'Загрузка...';
                elements.statusBar.className = 'status-bar';
                elements.loadingText.textContent = forceRefresh ? 'Принудительная загрузка...' : 'Загрузка данных...';
                
                const data = await fetchData(forceRefresh);
                
                // Проверяем, изменились ли данные
                const newHash = createDataHash(data);
                const dataChanged = newHash !== currentDataHash;
                
                if (dataChanged || forceRefresh) {
                    currentDataHash = newHash;
                    lastUpdateTime = Date.now();
                    updateUI(data);
                    
                    elements.statusText.textContent = `Данные обновлены ${forceRefresh ? '(принудительно)' : ''}`;
                    elements.statusBar.className = 'status-bar status-online';
                    
                    // Показываем уведомление об обновлении
                    if (dataChanged && !forceRefresh) {
                        showNotification('Данные обновлены!');
                    }
                    
                    console.log('Данные загружены:', data);
                } else {
                    elements.statusText.textContent = 'Данные актуальны';
                    elements.statusBar.className = 'status-bar status-online';
                    console.log('Данные не изменились');
                }
                
                return data;
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                elements.statusText.textContent = 'Ошибка загрузки';
                elements.statusBar.className = 'status-bar status-offline';
                
                showDemoData();
                return null;
            }
        }
        
        // Функция показа уведомления
        function showNotification(message) {
            // Создаем временное уведомление
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #10b981;
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            notification.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
        
        // Добавляем CSS для анимации уведомлений
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        
        // Демо данные
        function showDemoData() {
            const demoData = {
                totalCats: Math.floor(Math.random() * 1000) + 1500,
                totalAttacks: Math.floor(Math.random() * 2000) + 3000,
                avgSuccess: Math.floor(Math.random() * 30) + 60,
                totalMatroskin: Math.floor(Math.random() * 100) + 20,
                count: Math.floor(Math.random() * 30) + 15,
                timestamp: new Date().toISOString(),
                note: 'Демо данные (не удалось загрузить актуальные)'
            };
            
            updateUI(demoData);
            
            const noteContainer = document.getElementById('noteContainer');
            noteContainer.innerHTML = `
                <div class="note">
                    <strong><i class="fas fa-exclamation-triangle"></i> Внимание:</strong> 
                    Используются демо-данные. Актуальные данные временно недоступны.
                    <br><small>Проверьте подключение к интернету и обновите страницу.</small>
                </div>
            `;
        }
        
        // Обновление интерфейса
        function updateUI(data) {
            // Форматирование чисел
            function formatNumber(num) {
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }
            
            // Форматирование даты
            function formatDate(timestamp) {
                const date = new Date(timestamp);
                return date.toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
            
            // Обновляем значения
            document.getElementById('totalCats').textContent = formatNumber(data.totalCats);
            document.getElementById('totalAttacks').textContent = formatNumber(data.totalAttacks);
            document.getElementById('avgSuccess').textContent = data.avgSuccess + '%';
            document.getElementById('totalMatroskin').textContent = formatNumber(data.totalMatroskin);
            document.getElementById('count').textContent = formatNumber(data.count);
            document.getElementById('timestamp').textContent = formatDate(data.timestamp);
            
            // Время с последнего обновления
            const updateTime = new Date(data.timestamp);
            const now = new Date();
            const diffMinutes = Math.floor((now - updateTime) / (1000 * 60));
            document.getElementById('lastUpdate').textContent = diffMinutes < 1 ? 'Только что' : `${diffMinutes} мин назад`;
            
            // Статус данных
            const isDemo = data.note && data.note.toLowerCase().includes('демо');
            document.getElementById('dataStatus').textContent = isDemo ? 'Демо' : 'Актуальные';
            
            // Версия данных (хеш)
            document.getElementById('dataVersion').textContent = currentDataHash.substring(0, 8);
            
            // Информация о странице
            elements.pageInfo.textContent = `Данные обновлены: ${formatDate(data.timestamp)}`;
            
            // Примечание
            const noteContainer = document.getElementById('noteContainer');
            if (data.note && !isDemo) {
                noteContainer.innerHTML = `
                    <div class="note">
                        <strong><i class="fas fa-sticky-note"></i> Информация:</strong> ${data.note}
                    </div>
                `;
            } else if (!isDemo) {
                noteContainer.innerHTML = '';
            }
            
            // Показываем контент
            elements.loading.style.display = 'none';
            elements.content.style.display = 'block';
            
            // Сохраняем в localStorage
            try {
                localStorage.setItem('catStats', JSON.stringify(data));
                localStorage.setItem('catStatsTime', Date.now().toString());
                localStorage.setItem('catStatsHash', currentDataHash);
            } catch (e) {
                console.warn('Не удалось сохранить в localStorage');
            }
        }
        
        // Инициализация
        async function init() {
            // Пробуем загрузить сохраненные данные
            try {
                const savedData = localStorage.getItem('catStats');
                const savedTime = localStorage.getItem('catStatsTime');
                const savedHash = localStorage.getItem('catStatsHash');
                
                if (savedData && savedTime && savedHash) {
                    const data = JSON.parse(savedData);
                    const timeDiff = Date.now() - parseInt(savedTime);
                    
                    // Если данные не старше 2 минут, показываем их
                    if (timeDiff < 2 * 60 * 1000) {
                        currentDataHash = savedHash;
                        updateUI(data);
                        elements.statusText.textContent = 'Используются кешированные данные';
                        elements.statusBar.className = 'status-bar';
                    }
                }
            } catch (e) {
                console.warn('Ошибка загрузки из localStorage:', e);
            }
            
            // Загружаем актуальные данные
            await loadData();
            
            // Автообновление
            setInterval(() => loadData(), CONFIG.UPDATE_INTERVAL);
            
            // Кнопка обновления
            elements.refreshBtn.addEventListener('click', async () => {
                elements.refreshBtn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> Обновление...';
                elements.refreshBtn.disabled = true;
                
                await loadData();
                
                setTimeout(() => {
                    elements.refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Обновить данные';
                    elements.refreshBtn.disabled = false;
                }, 1000);
            });
            
            // Кнопка принудительного обновления
            elements.forceRefreshBtn.addEventListener('click', async () => {
                elements.forceRefreshBtn.innerHTML = '<i class="fas fa-bolt fa-spin"></i> Обновление...';
                elements.forceRefreshBtn.disabled = true;
                
                await loadData(true);
                
                setTimeout(() => {
                    elements.forceRefreshBtn.innerHTML = '<i class="fas fa-bolt"></i> Принудительное обновление';
                    elements.forceRefreshBtn.disabled = false;
                }, 1000);
            });
        }
        
        // Запускаем
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
