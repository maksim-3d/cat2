<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Статистика котов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .refresh-btn {
            width: 100%;
            padding: 18px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: #0077bb;
            transform: scale(1.02);
        }
        .timestamp {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            margin-top: 15px;
            font-style: italic;
        }
        .error {
            background: rgba(255, 50, 50, 0.2);
            border: 1px solid rgba(255, 50, 50, 0.5);
            border-radius: 10px;
            padding: 15px;
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐱 Статистика котов</h1>
            <p id="status">Подключение...</p>
        </div>
        
        <div id="stats">
            <div class="loading">
                <div class="spinner"></div>
                <div>Загрузка...</div>
            </div>
        </div>
        
        <button onclick="loadData()" class="refresh-btn">🔄 Обновить</button>
    </div>

    <script>
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Используем CORS прокси для обхода Mixed Content
        async function loadData() {
            console.log('Загружаю данные через CORS прокси...');
            document.getElementById('status').textContent = 'Загрузка...';
            
            try {
                // Способ 1: Используем публичный CORS прокси
                const proxyUrl = 'https://corsproxy.io/?';
                const targetUrl = 'http://78.40.188.120:3000/stats';
                
                const response = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Данные получены:', data);
                displayData(data);
                document.getElementById('status').textContent = 'Подключено ✓';
                
            } catch (error) {
                console.error('Ошибка:', error);
                
                // Способ 2: Пробуем другой прокси
                try {
                    await loadWithAllOrigins();
                } catch (e) {
                    // Способ 3: Показываем статические данные
                    showStaticData();
                    document.getElementById('status').textContent = 'Оффлайн режим';
                }
            }
        }
        
        // CORS прокси allorigins.win
        async function loadWithAllOrigins() {
            const response = await fetch('https://api.allorigins.win/get?url=' + 
                encodeURIComponent('http://78.40.188.120:3000/stats'));
            
            const result = await response.json();
            const data = JSON.parse(result.contents);
            displayData(data);
        }
        
        // Статические данные если сервер недоступен
        function showStaticData() {
            const staticData = {
                totalCats: 1500,
                totalAttacks: 3200,
                avgSuccess: 75,
                totalMatroskin: 42,
                count: 22,
                timestamp: new Date().toISOString()
            };
            displayData(staticData);
        }
        
        // Отображение данных
        function displayData(data) {
            document.getElementById('stats').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${formatNumber(data.totalCats || 0)}</div>
                        <div class="stat-label">Всего котов</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${formatNumber(data.totalAttacks || 0)}</div>
                        <div class="stat-label">Всего атак</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.avgSuccess || 0}%</div>
                        <div class="stat-label">Успешность</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${formatNumber(data.totalMatroskin || 0)}</div>
                        <div class="stat-label">Матросскины</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.count || 0}</div>
                        <div class="stat-label">Игроков онлайн</div>
                    </div>
                </div>
                <div style="text-align:center; color:white; margin-top:10px; font-size:12px;">
                    ${data.timestamp ? 'Обновлено: ' + new Date(data.timestamp).toLocaleTimeString() : 'Оффлайн данные'}
                </div>
            `;
        }
        
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }
        
        // Автостарт
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            setInterval(loadData, 30000);
        });
    </script>
</body>
</html>
